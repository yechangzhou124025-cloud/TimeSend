[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY", "DTZ", "PYI"]
ignore = [
    # The product intentionally schedules against the Windows user's local wall clock.
    "DTZ001",
    "DTZ005",
    "DTZ007",
    # User-facing validation messages are intentionally raised at the validation site.
    "TRY003",
    "TRY301",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
